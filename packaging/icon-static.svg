<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="fyolo">
  <title>fyolo</title>
  <!-- The mark from the landing page (web/landing/src/components/logo.tsx), a solid
       purple F on black, scaled from its 64-unit box by 8. The corner radius is
       Apple's icon template (114 @ 512) rather than the favicon's, so the macOS
       inset in scripts/render-icon.sh lands on the system squircle. -->
  <rect width="512" height="512" rx="114" fill="#000000"/>
  <g fill="#741c92">
    <rect x="128" y="96" width="96" height="320"/>
    <rect x="128" y="96" width="256" height="96"/>
    <rect x="128" y="256" width="224" height="64"/>
  </g>
</svg>
