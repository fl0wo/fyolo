name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag is the version; the build number is the commit count. The DMG is
# attached to the GitHub Release, and the Homebrew cask in fl0wo/homebrew-tap is
# pointed at it, so `brew install --cask fl0wo/tap/fyolo` serves it.
#
# The app is ad-hoc signed, not Developer ID signed or notarized. The cask
# clears the quarantine flag after install so Gatekeeper lets it open.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: fyolo
  TAP_REPO: fl0wo/homebrew-tap
  # Same toolchain pins as .github/workflows/fyolod.yml — keep them in step.
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256_AARCH64_MACOS: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      # Full history so the commit count (build number) works.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version and build number
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive a version from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (build $BUILD_NUMBER)"

      # `libghostty-vt-sys` invokes `zig` by name, so it has to be on PATH.
      - name: Install Zig (for fyolod's VT engine)
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256_AARCH64_MACOS}  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build app bundle (ad-hoc signed)
        env:
          SIGN_IDENTITY: "-"
          FYOLO_VERSION: ${{ steps.meta.outputs.version }}
          FYOLO_BUILD: ${{ steps.meta.outputs.build }}
        run: ./scripts/build-app.sh

      - name: Create DMG
        run: |
          brew install create-dmg
          APP="$PWD/${APP_NAME}.app"
          DMG_PATH="$RUNNER_TEMP/${APP_NAME}.dmg"

          VOLICON_ARGS=()
          ICNS="$APP/Contents/Resources/AppIcon.icns"
          [ -f "$ICNS" ] && VOLICON_ARGS=(--volicon "$ICNS")

          create-dmg \
            --volname "$APP_NAME" \
            "${VOLICON_ARGS[@]}" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 160 \
            --icon "${APP_NAME}.app" 180 170 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            "$DMG_PATH" \
            "$APP"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      # The daemons and clients are plain files in Resources that only matter
      # once someone points the app at a VPS, so check they made it into the DMG.
      - name: Verify the daemons and clients survived into the DMG
        run: |
          mount_point="$RUNNER_TEMP/dmg-check"
          mkdir -p "$mount_point"
          hdiutil attach "$DMG_PATH" -mountpoint "$mount_point" -nobrowse -quiet
          resources="$mount_point/${APP_NAME}.app/Contents/Resources"
          status=0
          for binary in \
            "fyolod:Mach-O" \
            "fyolod-x86_64-unknown-linux-musl:ELF 64-bit" \
            "fyolod-aarch64-unknown-linux-musl:ELF 64-bit" \
            "fyolo:Mach-O" \
            "fyolo-x86_64-unknown-linux-musl:ELF 64-bit" \
            "fyolo-aarch64-unknown-linux-musl:ELF 64-bit"; do
            name="${binary%%:*}"
            want="${binary#*:}"
            if [ ! -f "$resources/$name" ]; then
              echo "error: $name is missing from the shipped app" >&2
              status=1
              continue
            fi
            got="$(file -b "$resources/$name")"
            echo "$name: $got"
            case "$got" in
              *"$want"*) ;;
              *) echo "error: $name is not a $want binary" >&2; status=1 ;;
            esac
          done
          hdiutil detach "$mount_point" -quiet
          exit $status

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          gh release create "v${VERSION}" "$DMG_PATH" \
            --title "${APP_NAME} v${VERSION}" \
            --notes "Install or update with Homebrew: \`brew install --cask fl0wo/tap/${APP_NAME}\`" \
            --generate-notes

      # Rewrite the cask in the tap to point at this release. Auth is a write
      # deploy key on the tap repo, stored here as the TAP_DEPLOY_KEY secret.
      - name: Bump Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::notice::TAP_DEPLOY_KEY not set — skipping Homebrew cask bump."
            exit 0
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          SHA256=$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)

          KEY_FILE="$RUNNER_TEMP/tap_deploy_key"
          echo "$TAP_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 "git@github.com:${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' \
            -e "s/^  version .*/  version \"${VERSION}\"/" \
            -e "s/^  sha256 .*/  sha256 \"${SHA256}\"/" \
            Casks/fyolo.rb
          git -c user.name="fyolo-release" -c user.email="fyolo-release@users.noreply.github.com" \
            commit -am "fyolo ${VERSION}"
          git push
          echo "Bumped cask to ${VERSION} (${SHA256})"
